# Fly.io deployment.
#
# One machine serving the API and the built frontend from the same origin, which is
# what the Dockerfile produces. Nothing here is corpus-specific: the image builds its
# index at startup from whatever `data/raw` was in the build context.
#
# The corpus reaches the builder because `.dockerignore` deliberately does not exclude
# `data/raw`, while `.gitignore` does. `fly deploy` uploads the working directory
# honouring the former, so the document pack ships without ever entering the public
# repository. A deploy from a fresh clone has no pack and fails loudly at startup
# rather than serving an empty index.

app = "parcelpilot-support-agent"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Behind Fly's TLS termination, so the session cookie can carry Secure.
  COOKIE_SECURE = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true

  # Kept warm rather than scaled to zero. This URL exists to be opened once by a
  # reviewer, and a cold start is the first thing they would experience.
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  # A turn holds an SSE connection open for the length of the answer, so these are
  # concurrent conversations rather than instantaneous requests.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

[[http_service.checks]]
  path = "/api/health"
  method = "GET"
  interval = "30s"
  timeout = "5s"
  # Startup parses the document pack and builds the index before uvicorn binds.
  grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  # 256mb is enough to serve but tight while pypdf holds the pack open during the
  # startup build.
  memory = "512mb"
